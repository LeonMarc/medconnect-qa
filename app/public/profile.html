<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedConnect — Mi perfil</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f4f8; margin: 0; }
    header { background: #0b6b8a; color: #fff; padding: 1rem 1.5rem; }
    header a { color: #fff; text-decoration: none; font-size: .9rem; }
    main { max-width: 480px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 10px; padding: 1.5rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .row { margin: .5rem 0; }
    .row span { color: #667; font-size: .8rem; display: block; }
    .row strong { font-size: 1.05rem; color: #123; }
  </style>
</head>
<body>
  <header><a href="/feed">← Volver</a></header>
  <main>
    <div class="card">
      <div class="row"><span>Nombre</span><strong data-testid="profile-name">—</strong></div>
      <div class="row"><span>Especialidad</span><strong data-testid="profile-specialty">—</strong></div>
      <div class="row"><span>Matrícula</span><strong data-testid="profile-license">—</strong></div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login';
    } else {
      fetch('/api/profile', { headers: { Authorization: 'Bearer ' + token } })
        .then((r) => r.json())
        .then((data) => {
          document.querySelector('[data-testid="profile-name"]').textContent = data.name;
          document.querySelector('[data-testid="profile-specialty"]').textContent = data.specialty;
          document.querySelector('[data-testid="profile-license"]').textContent = data.license;
        });
    }
  </script>
</body>
</html>
