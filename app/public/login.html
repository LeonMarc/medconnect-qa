<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedConnect — Ingresar</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; margin: 0;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #fff; padding: 2rem; border-radius: 12px; width: 340px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; color: #0b6b8a; margin: 0 0 1.25rem; }
    label { display: block; font-size: .85rem; margin: .75rem 0 .25rem; color: #334; }
    input { width: 100%; padding: .6rem; border: 1px solid #cbd5e0; border-radius: 8px; }
    button { width: 100%; margin-top: 1.25rem; padding: .7rem; background: #0b6b8a;
      color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .error { color: #c0392b; font-size: .85rem; margin-top: .75rem; min-height: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MedConnect</h1>
    <label for="email">Email profesional</label>
    <input id="email" data-testid="login-email" type="email" placeholder="tu@correo.com" />
    <label for="password">Contraseña</label>
    <input id="password" data-testid="login-password" type="password" />
    <button data-testid="login-submit">Ingresar</button>
    <p class="error" data-testid="login-error"></p>
  </div>

  <script>
    const btn = document.querySelector('[data-testid="login-submit"]');
    const errorEl = document.querySelector('[data-testid="login-error"]');

    btn.addEventListener('click', async () => {
      errorEl.textContent = '';
      const email = document.querySelector('[data-testid="login-email"]').value;
      const password = document.querySelector('[data-testid="login-password"]').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      if (!res.ok) {
        errorEl.textContent = 'Credenciales inválidas';
        return;
      }
      const data = await res.json();
      localStorage.setItem('token', data.token);
      localStorage.setItem('userName', data.user.name);
      window.location.href = '/feed';
    });
  </script>
</body>
</html>
